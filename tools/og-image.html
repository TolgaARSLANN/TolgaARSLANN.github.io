<!doctype html>
<!--
  Source for assets/og-image.png (1200×630 social preview).
  Regenerate:
    chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --virtual-time-budget=8000 \
      --screenshot=assets/og-image.png tools/og-image.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #6e6e73;
    --line: rgba(255, 255, 255, .12); --sky: #2997ff; --status: #30d158;
    --gradient: linear-gradient(90deg, #2997ff 0%, #a98bff 50%, #ff6fa0 100%);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #000; }
  body {
    position: relative; color: var(--text);
    font-family: "SF Pro Display", -apple-system, "Inter", system-ui, sans-serif;
    font-optical-sizing: auto; -webkit-font-smoothing: antialiased;
  }

  .aurora {
    position: absolute; right: -160px; bottom: -260px; width: 900px; height: 700px;
    background:
      radial-gradient(closest-side at 30% 55%, rgba(41, 151, 255, .34), transparent),
      radial-gradient(closest-side at 65% 45%, rgba(170, 120, 255, .30), transparent),
      radial-gradient(closest-side at 50% 80%, rgba(255, 111, 160, .22), transparent);
    filter: blur(30px);
  }

  .frame { position: absolute; inset: 60px 72px 52px; display: flex; flex-direction: column; }

  .eyebrow { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 600; letter-spacing: -.01em; color: var(--text-2); }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--status); box-shadow: 0 0 0 5px rgba(48, 209, 88, .22); }

  .mid { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 48px; }
  h1 { font-size: 112px; font-weight: 600; line-height: 1; letter-spacing: -.035em; }
  .tagline {
    margin-top: 14px; width: fit-content;
    font-size: 54px; font-weight: 600; line-height: 1.1; letter-spacing: -.025em;
    background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .window {
    width: 380px; flex: none;
    border-radius: 18px; overflow: hidden;
    background: rgba(29, 29, 31, .86);
    border: 1px solid var(--line);
    box-shadow: 0 40px 90px -20px rgba(0, 0, 0, .8);
    font-family: var(--mono); font-size: 15px;
  }
  .head { display: grid; grid-template-columns: 60px 1fr 60px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .traffic { display: flex; gap: 7px; }
  .traffic i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
  .traffic i:nth-child(2) { background: #febc2e; }
  .traffic i:nth-child(3) { background: #28c840; }
  .title { text-align: center; color: var(--text); }
  .title span { color: var(--text-3); }
  .steps { padding: 8px 10px; }
  .step { display: grid; grid-template-columns: 22px 92px 1fr; align-items: center; gap: 10px; padding: 9px 8px; color: var(--text-2); }
  .step b { font-weight: 400; color: var(--text); }
  .ok { width: 18px; height: 18px; border-radius: 50%; background: var(--status); position: relative; }
  .ok::after { content: ""; position: absolute; left: 5px; top: 5px; width: 7px; height: 4px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg); }
  .foot { padding: 13px 18px; border-top: 1px solid var(--line); font-size: 14px; color: var(--status); }

  .bottom { display: flex; justify-content: space-between; align-items: center; padding-top: 24px; border-top: 1px solid var(--line); font-size: 22px; }
  .stack { color: var(--text-2); }
  .stack i { font-style: normal; color: var(--text-3); margin: 0 10px; }
  .url { color: var(--sky); font-weight: 600; }
</style>
</head>
<body>
  <div class="aurora"></div>

  <div class="frame">
    <p class="eyebrow"><span class="dot"></span>Full-Stack Developer · Istanbul</p>

    <div class="mid">
      <div>
        <h1>Tolga Arslan.</h1>
        <p class="tagline">Built. Tested. Shipped.</p>
      </div>

      <div class="window">
        <div class="head">
          <span class="traffic"><i></i><i></i><i></i></span>
          <span class="title">PetCareApp <span>/ main</span></span>
          <span></span>
        </div>
        <div class="steps">
          <div class="step"><span class="ok"></span><b>lint</b><span>ESLint</span></div>
          <div class="step"><span class="ok"></span><b>test:api</b><span>170+ Jest</span></div>
          <div class="step"><span class="ok"></span><b>test:ui</b><span>120+ Vitest</span></div>
          <div class="step"><span class="ok"></span><b>matrix</b><span>Node 22 · 24</span></div>
          <div class="step"><span class="ok"></span><b>build</b><span>Vite</span></div>
        </div>
        <div class="foot">✓ All checks passed</div>
      </div>
    </div>

    <div class="bottom">
      <div class="stack">React<i>·</i>Node.js<i>·</i>Express<i>·</i>Python<i>·</i>FastAPI</div>
      <div class="url">tolgaarslann.github.io ›</div>
    </div>
  </div>
</body>
</html>
