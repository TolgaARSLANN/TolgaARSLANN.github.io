<!doctype html>
<!--
  Source for assets/og-image.png (1200×630 social preview).
  Regenerate:
    chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --virtual-time-budget=6000 \
      --screenshot=assets/og-image.png tools/og-image.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#08090b; --text:#f0f0f1; --text-2:#a8a8b0; --text-3:#6f6f78; --line:rgba(255,255,255,.09); --accent:#c6f432; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body { position: relative; color: var(--text); font-family: 'Geist', sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'Geist Mono', monospace; }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(ellipse 85% 85% at 30% 20%, #000 25%, transparent 80%);
  }
  .glow { position: absolute; width: 760px; height: 760px; right: -220px; top: -320px;
          background: radial-gradient(circle, rgba(198,244,50,.16), transparent 62%); }

  .frame { position: absolute; inset: 56px 64px; display: flex; flex-direction: column; }

  .top { display: flex; justify-content: space-between; align-items: center; }
  .brand { font: 600 30px/1 'Geist Mono', monospace; letter-spacing: -.04em; }
  .brand span { color: var(--accent); }
  .status { display: flex; align-items: center; gap: 12px; font-size: 19px; color: var(--text-2); }
  .status .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px rgba(198,244,50,.18); }
  .status .sep { color: var(--text-3); }

  .mid { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 40px; }
  h1 { font-size: 168px; font-weight: 600; line-height: .84; letter-spacing: -.065em; }
  h1 .l2 { display: block; padding-left: 92px; }
  h1 .d { color: var(--accent); }

  .card { width: 372px; flex: none; border: 1px solid var(--line); border-radius: 18px;
          background: rgba(15,17,20,.92); box-shadow: 0 30px 80px -20px rgba(0,0,0,.7); }
  .card-head { display: flex; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .card-head .muted { color: var(--text-3); }
  .steps { padding: 8px 10px; }
  .step { display: grid; grid-template-columns: 22px 86px 1fr; align-items: center; gap: 10px; padding: 9px 8px; font-size: 15px; color: var(--text-2); }
  .step b { font-weight: 400; color: var(--text); }
  .ok { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); position: relative; }
  .ok::after { content: ""; position: absolute; left: 5px; top: 5px; width: 7px; height: 4px;
               border-left: 2px solid #0a0b0d; border-bottom: 2px solid #0a0b0d; transform: rotate(-45deg); }
  .card-foot { padding: 13px 18px; border-top: 1px solid var(--line); font-size: 14px; color: var(--accent); }

  .bottom { display: flex; justify-content: space-between; align-items: flex-end;
            padding-top: 26px; border-top: 1px solid var(--line); }
  .stack { font-size: 21px; color: var(--text-2); }
  .stack i { font-style: normal; color: var(--accent); margin: 0 12px; font-size: 13px; vertical-align: 3px; }
  .url { font-size: 21px; color: var(--text); }
  .url span { color: var(--accent); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="frame">
    <div class="top">
      <div class="brand">ta<span>/</span></div>
      <div class="status mono"><span class="dot"></span>Full-Stack Developer <span class="sep">/</span> Istanbul</div>
    </div>

    <div class="mid">
      <h1>Tolga<span class="l2">Arslan<span class="d">.</span></span></h1>

      <div class="card mono">
        <div class="card-head"><span>PetCareApp <span class="muted">/ main</span></span><span class="muted">CI</span></div>
        <div class="steps">
          <div class="step"><span class="ok"></span><b>lint</b><span>ESLint</span></div>
          <div class="step"><span class="ok"></span><b>test:api</b><span>170+ Jest</span></div>
          <div class="step"><span class="ok"></span><b>test:ui</b><span>120+ Vitest</span></div>
          <div class="step"><span class="ok"></span><b>matrix</b><span>Node 22 · 24</span></div>
          <div class="step"><span class="ok"></span><b>build</b><span>Vite</span></div>
        </div>
        <div class="card-foot">✓ All checks passed</div>
      </div>
    </div>

    <div class="bottom mono">
      <div class="stack">React<i>✦</i>Node.js<i>✦</i>Express<i>✦</i>Python<i>✦</i>FastAPI</div>
      <div class="url">tolgaarslann.github.io<span> ↗</span></div>
    </div>
  </div>
</body>
</html>
